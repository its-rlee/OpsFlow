name: CI
on:
  push:
    branches: [main, feat/opsflow-mvp]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run db:generate --workspace=@opsflow/api
      - run: npm run build
      - run: npm test
